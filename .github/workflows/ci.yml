name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  console:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    env:
      DATABASE_URL: postgres://blaktail:blaktail@127.0.0.1:5432/blaktail
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      COORD_BASE_URL: https://coord.example.internal
      BLAKTAIL_AUTH_HMAC_SECRET: ci-auth-hmac-secret-at-least-32-chars
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: npm ci
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
