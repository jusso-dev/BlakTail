name: CI

on:
  push:
  pull_request:

concurrency:
  group: blaktail-self-hosted
  cancel-in-progress: false

jobs:
  check:
    name: fmt, clippy, test
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
