name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Validate rollout scripts
        run: >-
          sh -n scripts/package-agent.sh scripts/install-agent.sh
          scripts/agent-checksums.sh scripts/two-vm-test.sh

      - name: Build and inspect Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm
          cargo build --locked -p blaktaild
          dist="${RUNNER_TEMP}/blaktail-agent-packages"
          scripts/package-agent.sh deb target/debug/blaktaild "${dist}"
          scripts/package-agent.sh rpm target/debug/blaktaild "${dist}"
          scripts/agent-checksums.sh "${dist}"
          (cd "${dist}" && sha256sum --check SHA256SUMS)
          dpkg-deb --info "${dist}/blaktaild-x86_64-unknown-linux-gnu.deb"
          dpkg-deb --contents "${dist}/blaktaild-x86_64-unknown-linux-gnu.deb" | grep '/usr/local/bin/blaktaild'
          rpm --query --package --info "${dist}/blaktaild-x86_64-unknown-linux-gnu.rpm"
          rpm --query --package --list "${dist}/blaktaild-x86_64-unknown-linux-gnu.rpm" | grep '^/usr/local/bin/blaktaild$'

  console:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    env:
      DATABASE_URL: postgres://blaktail:blaktail@127.0.0.1:5432/blaktail
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      COORD_BASE_URL: https://coord.example.internal
      BLAKTAIL_AUTH_HMAC_SECRET: ci-auth-hmac-secret-at-least-32-chars
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: npm ci
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
